name: Sync reviews (Kmong + biojungsuk site)

on:
  schedule:
    - cron: '25 * * * *'   # every hour (best-effort; GitHub may delay)
  workflow_dispatch:        # allow manual run

permissions:
  contents: write

concurrency:
  group: sync-kmong
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 크몽 건수·평점 + biojungsuk 상품 후기(사이트맵 전수)를 index.html에 반영.
      # 수집 실패 시 이전 값 유지, 검증 실패 시 파일을 쓰지 않는다(sync.mjs 내부 규칙).
      - name: Sync review data into index.html
        run: node sync.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No change — already in sync."
            exit 0
          fi
          git config user.name  "kmong-sync-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync reviews (Kmong count/rating + site review cards)"
          git push
